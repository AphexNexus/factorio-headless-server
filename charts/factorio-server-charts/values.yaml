# yaml-language-server: $schema=values.schema.json

# -- replicaCount Number of replicas to create (only 1 is supported)
replicaCount: 1
# -- Sets the pod to run on the host network. This is required for the port-fixer to work properly, but it can be disabled if you don't need it.
hostNetworkEnabled: true

# -- Useful for fixing file permissions. See official [docs](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/).
securityContext:
  fsGroup: 845

# -- See Factorio Tools [Dockerfile](https://github.com/factoriotools/factorio-docker/blob/master/docker/Dockerfile)
podSecurityContext:
  runAsUser: 845
  runAsGroup: 845

image:
  # -- Factorio image repository
  repository: "factoriotools/factorio"
  # -- Factorio image pull policy
  pullPolicy: Always
  # -- Factorio image tag (immutable tags are recommended) Overrides the image tag whose default is the chart appVersion.
  tag: "stable"
  ## You should set a fixed version, i.e.:
  # tag: "1.1.37"

# -- nodeSelector Node labels for pod assignment
nodeSelector: {}
#  beta.kubernetes.io/os: linux
#  beta.kubernetes.io/arch: amd64
#  kubernetes.io/hostname: your-cool-hostname

## The service is a kind tricky, so factorio uses UDP, but not every cloud provider is able to route UDP traffic.
## I.e. your cloud provider has LoadBalancers without the ability for UDP protocol. Furthermore kubectl ist not able to route UDP Traffic
## ref: https://github.com/kubernetes/kubernetes/issues/47862
## You have to expose factorio on a NodePort and map a port between 30000 and 32767, but the native port is 34197. So you have always to specify the port in factorio.
## The best way ist to define a ClusterIP service and define one or more externalIPs. Of course this IPs must be available on the node the factorio pod runs on!
service:
  # -- Factorio service type. If you use "type: NodePort" set the port to a value you like in the range of 30000-32767. Leave it blank for a random port
  type: NodePort
  ## Represents the dual-stack-ness requested or required by this Service. Possible values are
  ## SingleStack, PreferDualStack or RequireDualStack.
  ## The ipFamilies and clusterIPs fields depend on the value of this field.
  ## Ref: https://kubernetes.io/docs/concepts/services-networking/dual-stack/
  ipFamilyPolicy: "SingleStack"

  ## List of IP families (e.g. IPv4, IPv6) assigned to the service. This field is usually assigned automatically
  ## based on cluster configuration and the ipFamilyPolicy field.
  ## Ref: https://kubernetes.io/docs/concepts/services-networking/dual-stack/
  ipFamilies:
    - IPv4
  # -- Factorio service port
  port: 31497
  ## -- (array) If you are able to map an external IP, set it here
  # externalIPs:
  #  - "192.168.0.1"
  #  - "192.168.0.2"
  #
  #
  ## If you use "type: NodePort" set the port to a value you like in the range of 30000-32767. Leave it blank for a random port
  # nodePort: ""
  ## Examples:
  ## NodePort setup

  ## ClusterIp setup
  # ClusterIP:
  #   port: 34197
  ## LoadBalancer setup
  # type: LoadBalancer
  # externalTrafficPolicy: Cluster
  # -- Additional custom annotations for Factorio service
  annotations: {}
  ## -- @ignored Additional custom labels for Factorio service ( future place holder )
  #labels: {}

resources:
  ## We have to ensure that factorio have enough computing resources avaiable. We set here an absolute minimum
  ## Keep in mind that big factorio base can consume a lot of memory and cpu
  requests:
    # -- The requested memory for the Factorio containers
    memory: 512Mi
    # -- The requested cpu for the Factorio containers
    cpu: 500m
  # -- If you like to limit Factorio resources
  limits: {}
  # limits:
  #   memory: 1024Mi
  #   cpu: 1000m


## IMPORTANT: use with care, it is suggested to leave as that for upgrade purposes
## ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
# -- Strategy Parameters
strategy:
  # -- Strategy used to replace old pods
  type: Recreate
  # type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 0

# -- Tolerations for pod assignment
tolerations: []

# -- Affinity rules for pod assignment
affinity: {}

#### Persistence Configuration ####
## Sets the data persistence volume configuration
## IMPORTANT: If you do not setup a PV all your savegames will be lost on pod recreation or helm upgrade
persistence:
  # -- Enable persistence using Persistent Volume Claims
  enabled: true
  dataDir:
    # -- Size of the Persistent Volume Claim
    Size: "1Gi"
    ## -- The name of an existing PVC to use for persistence
    # existingClaim: "existing-claim-name"
  # -- If you like to use a specific storageClassName, set the name. Leave it blank for the default class
  storageClassName: ""
  # -- If you have annotations to spin up a PV i.e. the location. Remove the curly braces
  annotations: {}
  # -- If you have additional labels to apply to the volume
  labels: {}

#### Additional containers ####
# Specify any additional sidecar containers for the deployment here, such as log or metric collectors.
# See https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.34/#container-v1-core for the full Container
# reference.
# -- Additional Containers
additionalContainers: []
  # - name: node_exporter
  #   image: quay.io/prometheus/node_exporter:v1.9.1
  #   command:
  #     - --collector.disable-defaults
  #     - --collector.textfile
  #     - --collector.textfile.directory=/factorio/script-output/
  #   ports:
  #     - name: metrics
  #       containerPort: 9100



#### Factorio application configuration ####
# -- Mods Parameters
mods:
  image:
    repository: "ghcr.io/sqljames/factorio-mod-downloader"
    ## Container image pull policy
    pullPolicy: Always
    ## Overrides the image tag whose default is the chart appVersion.
    tag: "1.0.1"
    ## You should set an fix version, i.e.:
    # tag: "1.1.37"
  # -- Enable mods
  enabled: false
# in order to use the mods portal you will need to specify the username and token in the server_settings.
  # -- List of official mods to be downloaded from Factorio Mod Portal
  portal: []
#  - name: factorissimo-2-notnotmelon
#    version: 3.5.11
# unofficial section is meant to just allow you to download and place folders into the mods folder.
# we will not check version compatibility automatically with these downloads.
# you can encounter an error if the file names dont match what the mod is expecting for example
# Error Util.cpp:83: Failed to load mod "Squeak-Through": Filename of mod
# /factorio/mods/Squeak-Through.zip doesn't match the expected Squeak Through_1.8.2.zip (case sensitive!)
  # -- List of unofficial mods name and url to download into the mods folder
  unofficial: []
#     - url: "https://github.com/Suprcheese/Squeak-Through/archive/refs/tags/1.8.2.zip"
#       name: "Squeak Through_1.8.2.zip"

#### Factorio Server Configuration ####
# -- Factorio Server Parameters
factorioServer:
  # -- Factorio save name
  save_name: "replaceMe"
  # -- Generate a new save if `save_name` is not found
  generate_new_save: true
  # -- Update mods on server start
  update_mods_on_start: false
  # -- Load latest save
  load_latest_save: true
  # -- Enables or disables the mods for DLC Space Age in mod-list.json
  enable_space_age: true
  # factorio game server port
  # the default game port (34197) has been changed to 31497 to resolve issues when using the port-fixer.
  # this port setting is typically for internal Kubernetes configuration only, and in most cases, it does not need to be modified.
  # if it is necessary to change the game server port where you connect to the game, update the "service.port" value accordingly.
  # -- Factorio Game Server port
  port: 31497
  # factorio game rcon port
  # this port setting is typically for internal Kubernetes configuration only, and in most cases, it does not need to be modified.
  # if it is necessary to change the rcon server port where you connect to it, update the "rcon.port" value accordingly.
  # -- Factorio Server RCON port
  rcon_port: 27015
  # -- Additional environment values for the Factorio Server container
  env: {}
    # - name: MY_VAR
    #   value: "my_value"

#### Factorio Save Importer Configuration ####
# -- Import Save Parameters
import_save:
  # -- Enable save importer
  enabled: true
  # -- URL to download save from (http or https only). If no url is specified, saves can still be manually imported by placing the file in "/factorio/save-importer/import"
  source_url: ""
  # -- Reimport from the source_url if the checksum of the file changes
  reimport_on_change: false
  # -- Reimport from the source_url AND OVERWRITE PREVIOUS SAVE every time pod is initialized. good for demos or testing
  reimport_every_time: false

#### Factorio Account Configuration ####
# -- Account Parameters
account:
  # Existing secret containing a valid factorio.com username and either a password or a token
  # Example:
  #
  # apiVersion: v1
  # kind: Secret
  # metadata:
  #   name: account-secret
  # data:
  #   username: <username in base64>
  #   password: <password in base64>
  #
  # -- Existing k8s secret containing a valid factorio.com username and either a password or a token (or both)
  accountSecret: ''
  # Your factorio.com login credentials. Required for games with visibility public
  # -- Your factorio.com username. Ignored if `account.accountSecret` is set
  username: ''
  # -- Your factorio.com password. Ignored if `account.accountSecret` is set
  password: ''
  # -- Your factorio.com authentication token. May be used instead of password above.
  token: ''

#### Factorio Server Password Configuration ####
# -- Factorio Server Password Parameters
serverPassword:
  # -- Password required to log into the factorio server. Ignored if `serverPassword.passwordSecret` is set
  game_password: ''
  # -- Existing k8s Secret containing a `game_password` data entry
  passwordSecret: ''

#### Factorio Server Settings Configuration ####
# -- Server Settings Parameters
server_settings:
  # -- Name of the game as it will appear in the game listing
  name: Factorio
  # -- Description of the game that will appear in the listing
  description: "Factorio running on Kubernetes"
  # -- Tags for the game that will appear in the listing
  tags:
  - game
  - tags
  # Maximum number of players allowed, admins can join even a full server. 0 means unlimited.
  max_players: 0
  # -- Game visibility parameters. See Factorio documentation for more details: https://wiki.factorio.com/Multiplayer#How_to_list_a_server-hosted_game_on_the_matching_server
  visibility:
    # -- Game will be published on the official Factorio matching server
    public: false
    # -- Game will be broadcast on LAN
    lan: true

  # -- When set to true, the server will only allow clients that have a valid Factorio.com account
  require_user_verification: false
  # -- optional, default value is 0. 0 means unlimited.
  max_upload_in_kilobytes_per_second: 0
  # -- optional, default value is 5. 0 means unlimited.
  max_upload_slots: 5
  # -- optional one tick is 16ms in default speed, default value is 0. 0 means no minimum.
  minimum_latency_in_ticks: 0
  # -- Players that played on this map already can join even when the max player limit was reached.
  ignore_player_limit_for_returning_players: false
  # -- possible values are, true, false and admins-only
  allow_commands: admins-only
  # -- Autosave interval in minutes
  autosave_interval: 10
  # -- server autosave slots, it is cycled through when the server autosaves.
  autosave_slots: 5
  # -- How many minutes until someone is kicked when doing nothing, 0 for never.
  afk_autokick_interval: 0
  # -- Whether should the server be paused when no players are present.
  auto_pause: true
  # -- Whether should the server be paused when someone is connecting to the server.
  auto_pause_when_players_connect: false
  # -- specifies if anyone can pause or only admins
  only_admins_can_pause_the_game: true
  # -- Whether autosaves should be saved only on server or also on all connected clients. Default is true.
  autosave_only_on_server: true
  # -- Highly experimental feature, enable only at your own risk of losing your saves. On UNIX systems, server will fork itself to create an autosave. Autosaving on connected Windows clients will be disabled regardless of autosave_only_on_server option.
  non_blocking_saving: false
  # -- Network tick rate. Maximum rate game updates packets are sent at before bundling them together. Minimum value is 6, maximum value is 240.
  max_heartbeats_per_second: 60
  #  Long network messages are split into segments that are sent
  #  over multiple ticks. Their size depends on the number of peers currently connected.
  #  Increasing the segment size will increase upload bandwidth requirement for the server
  #  and download bandwidth requirement for clients. This setting only affects server
  #  outbound messages. Changing these settings can have a negative impact on connection
  #  stability for some clients.
  minimum_segment_size: 25
  minimum_segment_size_peer_count: 20
  maximum_segment_size: 100
  maximum_segment_size_peer_count: 10

## @section
## @param port_fixer.enabled
## @param image.repository
## @param image.tag
## @param image.pullPolicy
## @param image.port
#### Factorio Port Fixer Configuration ####
# -- Port Fixer Parameters
port_fixer:
  # Adds an extra container that tries to help with connection issues via the public server browser.
  # This is especially useful when you can’t set up outgoing static port mappings and see log messages like these:
  # > Warning ServerRouter.cpp:541: Received own address message reply with conflicting address (got IP ADDR:({<ip>:19296}), expected IP ADDR:({<ip>:58037}))
  # > Warning ServerMultiplayerManager.cpp:651: Determining own address has failed. Best guess: IP ADDR:({<ip>:58037})
  # > Warning ServerRouter.cpp:541: Received own address message reply with conflicting address (got IP ADDR:({<ip>:19297}), expected IP ADDR:({<ip>:58037}))
  # > Warning ServerRouter.cpp:541: Received own address message reply with conflicting address (got IP ADDR:({<ip>:24105}), expected IP ADDR:({<ip>:58037}))
  # Note: Port forwarding for incoming traffic still needs to be set up properly for this to work.
  # For more info, check out:
  #   - https://github.com/SQLJames/factorio-server-charts/issues/15
  # -- Enable the Factorio Port Fixer
  enabled: false
  image:
    # -- Factorio port-fixer image repository
    repository: "ghcr.io/zcube/factorio-port-fixer"
    # -- Factorio port fixer image pull policy
    pullPolicy: Always
    # -- Factorio port fixer image tag (immutable tags are recommended)
    tag: latest
  # -- (int) Factorio port to announce via port-fixer, defaults to service.port
  port: ''

## @param rcon.external Enable RCON external access (deploy RCON service)
## @param rcon.type RCON service type
## @param rcon.serviceAnnotations RCON service annotations
## @param rcon.passwordSecret Existing secret containing a `rconpw` data field
## @param rcon.password Password for RCON, ignored if `rcon.passwordSecret` is set
## @param rcon.port RCON service external port
# Password and port for the rcon service
rcon:
  ## Represents the dual-stack-ness requested or required by this Service. Possible values are
  ## SingleStack, PreferDualStack or RequireDualStack.
  ## The ipFamilies and clusterIPs fields depend on the value of this field.
  ## Ref: https://kubernetes.io/docs/concepts/services-networking/dual-stack/
  ipFamilyPolicy: "SingleStack"

  ## List of IP families (e.g. IPv4, IPv6) assigned to the service. This field is usually assigned automatically
  ## based on cluster configuration and the ipFamilyPolicy field.
  ## Ref: https://kubernetes.io/docs/concepts/services-networking/dual-stack/
  ipFamilies:
    - IPv4
  external: true
  type: LoadBalancer
  serviceAnnotations: {}
  # Existing secret containing a `rconpw` data field
  passwordSecret: ""

  # Password for rcon
  password: "CHANGEMECHANGEME"

  # rcon port
  port: 30100

## @param rconAPI.enabled Enable or disable the RCON API service
## @param rconAPI.image.repository
## @param rconAPI.image.tag
## @param rconAPI.image.pullPolicy
## @param rconAPI.type
## @param rconAPI.serviceAnnotations
## @param rconAPI.httpPort
## @param rconAPI.grpcPort
## @param rconAPI.ingress.enabled
## @param rconAPI.ingress.hostname
## @param rconAPI.ingress.className
## @param rconAPI.ingress.annotations
## @param rconAPI.ingress.tls.enabled
## @param rconAPI.ingress.tls.secretName
# -- RCON API Parameters
rconAPI:
  ## Represents the dual-stack-ness requested or required by this Service. Possible values are
  ## SingleStack, PreferDualStack or RequireDualStack.
  ## The ipFamilies and clusterIPs fields depend on the value of this field.
  ## Ref: https://kubernetes.io/docs/concepts/services-networking/dual-stack/
  # -- Determines how cluster IPs are allocated for the RCON API service. Possible values are SingleStack, PreferDualStack, or RequireDualStack.
  ipFamilyPolicy: "SingleStack"

  ## List of IP families (e.g. IPv4, IPv6) assigned to the service. This field is usually assigned automatically
  ## based on cluster configuration and the ipFamilyPolicy field.
  ## Ref: https://kubernetes.io/docs/concepts/services-networking/dual-stack/
  # -- List of IP families (e.g., IPv4, IPv6) assigned to the RCON API service. This field is usually assigned automatically based on cluster configuration and the ipFamilyPolicy field.
  ipFamilies:
    - IPv4
  # -- Enable or disable the RCON API service
  enabled: false
  # -- RCON API container image configuration
  image:
    # -- RCON-API image repository
    repository: "ghcr.io/nekomeowww/factorio-rcon-api"
    # -- RCON-API image pull policy
    pullPolicy: Always
    # -- RCON-API image tag (immutable tags are recommended)
    tag: latest
  # -- Kubernetes service type for the RCON API (e.g., ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # -- Annotations to add to the RCON API service
  serviceAnnotations: {}
  # -- Internal port on which the HTTP API for RCON is exposed
  httpPort: 30110
  # -- Internal port on which the gRPC API for RCON is exposed
  grpcPort: 30111

  ingress:
    # -- Enable or disable the Ingress for the RCON API service
    enabled: true
    # -- Hostname for the RCON API Ingress
    hostname: "factorio.example.com"
    # -- Ingress class name for selecting the Ingress controller (e.g., nginx, cilium)
    className: "nginx"
    # -- Additional annotations for the Ingress resource
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    tls:
      # -- Enable or disable TLS for the Ingress
      enabled: false
      # -- Kubernetes Secret name for TLS certificates used by the Ingress
      secretName: "cert-factorio.example.com"

## @param map_gen_settings.width Map width in tiles; 0 means infinite
## @param map_gen_settings.height Map height in tiles; 0 means infinite
## @param map_gen_settings.starting_area Multiplier for biter free zone radius
## @param map_gen_settings.peaceful_mode
## @param map_gen_settings.autoplace_controls
## @param map_gen_settings.cliff_settings.name
## @param map_gen_settings.cliff_settings.cliff_elevation_0
## @param map_gen_settings.cliff_settings.cliff_elevation_interval
## @param map_gen_settings.cliff_settings.richness
## @skip map_gen_settings.property_expression_names
## @extra map_gen_settings.property_expression_names [object] Overrides for property value generators (map type)
## @skip map_gen_settings.starting_points
## @extra map_gen_settings.starting_points [array] List of starting points for the map
## @param map_gen_settings.seed Map RNG Seed
#### Factorio Map Generation Settings ####
# -- Map Generation Settings Parameters
map_gen_settings:
  # -- Width and height of map, in tiles; 0 means infinite
  width: 0
  # -- Width and height of map, in tiles; 0 means infinite
  height: 0
  # -- Multiplier for biter free zone radius
  starting_area: 1
  # -- Enable Peaceful mode
  peaceful_mode: false
  # -- Override default ore, trees and enemy bases frequency, size and richness. Leave empty for default values. Supports including modded ores
  autoplace_controls: {}
#    water:
#      frequency: 1
#      size: 1
#    coal:
#      frequency: 1
#      size: 1
#      richness: 1
#    stone:
#      frequency: 1
#      size: 1
#      richness: 1
#    copper-ore:
#      frequency: 1
#      size: 1
#      richness: 1
#    iron-ore:
#      frequency: 1
#      size: 1
#      richness: 1
#    uranium-ore:
#      frequency: 1
#      size: 1
#      richness: 1
#    crude-oil:
#      frequency: 1
#      size: 1
#      richness: 1
#    trees:
#      frequency: 1
#      size: 1
#    enemy-base:
#      frequency: 1
#      size: 1
  # -- Override default cliff prototype name
  cliff_settings:
    # -- Name of the cliff prototype
    name: cliff
    # -- Override elevation of first row of cliffs
    cliff_elevation_0: 10
    # Elevation difference between successive rows of cliffs.
    # This is inversely proportional to frequency in the map generation GUI. Specifically, when set from the GUI the value is 40 / frequency.
    # -- Override elevation difference between successive rows of cliffs
    cliff_elevation_interval: 40
    # -- Called cliff continuity in the map generator GUI. 0 will result in no cliffs, 10 will make all cliff rows completely solid
    richness: 1
  # Overrides for property value generators (map type)
  # Leave elevation blank to get normal terrain.
  # Use 'elevation': 'elevation_island' to get an island.
  # Moisture and terrain type are also controlled via this.
  # "control:moisture:frequency is "
  # "control:moisture:bias "
  # "control:aux:frequency is "
  # "control:aux:bias is ."
  # -- Overrides for property value generators (map type)
  property_expression_names:
    # -- The inverse of the moisture scale in the map generator GUI
    control:moisture:frequency: '1'
    # -- The moisture bias in the map generator GUI
    control:moisture:bias: '0'
    # -- The inverse of the terrain type scale in the map generator GUI
    control:aux:frequency: '1'
    # -- The terrain type bias in the map generator GUI
    control:aux:bias: '0'
  # -- Starting point coordinates for the map.
  starting_points:
  - "x": 0
    "y": 0
  # --Use null for a random seed, number for a specific seed.
  seed: 0

## @param map_settings.difficulty_settings.technology_price_multiplier
## @param map_settings.difficulty_settings.spoil_time_modifier
## @param map_settings.asteroids.spawning_rate
## @param map_settings.asteroids.max_ray_portals_expanded_per_tick
## @skip map_settings.pollution
## @extra map_settings.pollution.enabled
## @skip map_settings.enemy_evolution
## @extra map_settings.enemy_evolution.enabled Enable enemy evolution. Check values.yaml to know what enemy evolution values you can override
## @skip map_settings.enemy_expansion
## @extra map_settings.enemy_expansion.enabled Enable enemy expansion. Check values.yaml to know what enemy expansion values you can override
## @skip map_settings.unit_group
## @extra map_settings.unit_group [object] Override default unit group values. Check values.yaml to know what values you can override
## @skip map_settings.steering
## @extra map_settings.steering [object] Override default steering values. Check values.yaml to know what values you can override
## @skip map_settings.path_finder
## @extra map_settings.path_finder [object] Override default pathfinder values. Check values.yaml to know what values you can override
## @param map_settings.max_failed_behavior_count If a behavior fails this many times, the enemy (or enemy group) is destroyed. This solves biters stuck within their own base.
#### Factorio Map Settings Configuration ####
map_settings:
  difficulty_settings:
    # -- Research cost multiplier
    technology_price_multiplier: 1
    # -- A value in range [0.01, 100] that modifies the time it takes for items to spoil. 1 is normal, 0.5 is half as long, 2 is twice as long, etc
    spoil_time_modifier: 1
  asteroids:
    # -- Controls the performance limit or expansion rate for ray portals/asteroid pathing calculations per game tick during space travel and asteroid belt generation
    max_ray_portals_expanded_per_tick: 100
    # -- Asteroid Spawing rate
    spawning_rate: 1
  # -- These values are for the time frame of one second (60 ticks).
  pollution:
    # -- Enable pollution.
    enabled: true
    # these are values for 60 ticks (1 simulated second)
    # amount that is diffused to neighboring chunk
    # -- The amount of pollution diffused into neighboring chunks per second
    diffusion_ratio: 0.02
    # -- Map setting that defines the minimum amount of pollution (measured in Pollution Units, or PUs) required on a chunk before it starts spreading to neighboring chunks
    min_to_diffuse: 15
    # -- Pollution setting that controls how much pollution is naturally absorbed and cleaned up by terrain tiles per tick
    ageing: 1
    # -- The maximum expected pollution value that can be visualised inside a single chunk on the map
    expected_max_per_chunk: 150
    # -- Map configuration variable within the PollutionMapSettings that dictates the minimum visual threshold for pollution rendering on the map
    min_to_show_per_chunk: 50
    # -- Map prototype setting that defines the minimum pollution threshold required in a single chunk before trees can begin taking environmental damage
    min_pollution_to_damage_trees: 60
    # -- Pollution threshold inside a single 32x32 chunk at which the probability for trees to receive environmental damage maxes out
    pollution_with_max_forest_damage: 150
    # -- Tree damage from pollution is calculated based on how much pollution is in a chunk above the minimum threshold of 60 units
    pollution_per_tree_damage: 50
    pollution_restored_per_tree_damage: 10
    # -- Hidden map setting dictates the environmental threshold required for damaged trees to naturally recover
    max_pollution_to_restore_trees: 20
    # -- Map generation setting that controls how much pollution an enemy spawner needs to absorb before adding a unit to an attack group
    enemy_attack_pollution_consumption_modifier: 1
  # -- These values represent a percentual increase in evolution. This means a value of 0.1 would increase evolution by 10%.
  enemy_evolution:
    # -- Whether enemy evolution is enabled at all
    enabled: true
    # -- The amount evolution naturally progresses by every second
    time_factor: 0.000004
    # -- The amount evolution naturally progresses by every second
    destroy_factor: 0.002
    # -- The amount evolution progresses for every unit of pollution
    pollution_factor: 0.0000009
  enemy_expansion:
    # -- Whether enemy expansion is enabled at all
    enabled: true
    # -- Distance in chunks from the furthest base around to prevent expansions from reaching too far into the player's territory
    max_expansion_distance: 7
    # -- Distance in chunks from the furthest base around to prevent expansions from being too close to existing bases
    friendly_base_influence_radius: 2
    # -- The game checks a square region extending ${value} chunks out in all directions when calculating whether biters can expand into a new location
    enemy_building_influence_radius: 2
    building_coefficient: 0.1
    other_base_coefficient: 2
    neighbouring_chunk_coefficient: 0.5
    neighbouring_base_chunk_coefficient: 0.4
    max_colliding_tiles_coefficient: 0.9
    # -- The minimum number of biters/spitters required to form a group tasked with expanding and building a new enemy base
    settler_group_min_size: 5
    # -- The maximum size of a biter group sent out to create a new base
    settler_group_max_size: 20
    # -- The default minimum expansion cooldown (min_expansion_cooldown) is 14,400 ticks (4 minutes)
    min_expansion_cooldown: 14400
    # -- The default maximum expansion cooldown (max_expansion_cooldown) is 216,000 ticks (1 hour)
    max_expansion_cooldown: 216000
  unit_group:
    # -- The minimum time (measured in game ticks) that a pollution-triggered biters/spitters attack group waits and gathers before marching toward a target
    min_group_gathering_time: 3600
    # -- The maximum time (measured in game ticks) that a pollution-triggered biters/spitters attack group waits and gathers before marching toward a target
    max_group_gathering_time: 36000
    # -- A unit_group parameter that controls how long (measured in game ticks) an enemy attack or expansion group waits for stragglers after it finishes gathering
    max_wait_time_for_late_members: 7200
    # -- The maximum spatial limit for an enemy unit attack group
    max_group_radius: 30
    # -- The minimum spatial limit for an enemy unit attack group
    min_group_radius: 5
    # -- A dynamic map and prototype property used to manage biter behavior within an attack group
    max_member_speedup_when_behind: 1.4
    # -- A dynamic map and prototype property used to manage biter behavior within an attack group
    max_member_slowdown_when_ahead: 0.6
    # -- A map and unit group setting that controls how much an entire enemy group slows down when members fall too far behind
    max_group_slowdown_factor: 0.3
    # -- A unit group setting that controls when a lagging biter or spitter forces the entire attack group to slow down
    max_group_member_fallback_factor: 3
    # -- A engine setting that dictates how enemy biter groups behave when a member falls behind during movement
    member_disown_distance: 10
    # -- A map setting that determines how many ticks a unit group (like a biter attack squad) will wait after a lagging biter catches up before the group resumes moving.
    tick_tolerance_when_member_arrives: 60
    # -- A map setting that defines the maximum number of automatically created unit groups gathering for an attack at any time
    max_gathering_unit_groups: 30
    # -- The maximum number of enemy biters or spitters that can gather into a single automatically created attack group (swarm)
    max_unit_group_size: 200
  steering:
    default:
      radius: 1.2
      separation_force: 0.005
      separation_factor: 1.2
      force_unit_fuzzy_goto_behavior: false
    moving:
      radius: 3
      separation_force: 0.01
      separation_factor: 3
      force_unit_fuzzy_goto_behavior: false
  path_finder:
    fwd2bwd_ratio: 5
    goal_pressure_ratio: 2
    max_steps_worked_per_tick: 1000
    max_work_done_per_tick: 8000
    use_path_cache: true
    short_cache_size: 5
    long_cache_size: 25
    short_cache_min_cacheable_distance: 10
    short_cache_min_algo_steps_to_cache: 50
    long_cache_min_cacheable_distance: 30
    cache_max_connect_to_cache_steps_multiplier: 100
    cache_accept_path_start_distance_ratio: 0.2
    cache_accept_path_end_distance_ratio: 0.15
    negative_cache_accept_path_start_distance_ratio: 0.3
    negative_cache_accept_path_end_distance_ratio: 0.3
    cache_path_start_distance_rating_multiplier: 10
    cache_path_end_distance_rating_multiplier: 20
    stale_enemy_with_same_destination_collision_penalty: 30
    ignore_moving_enemy_collision_distance: 5
    enemy_with_different_destination_collision_penalty: 30
    general_entity_collision_penalty: 10
    general_entity_subsequent_collision_penalty: 3
    extended_collision_penalty: 3
    max_clients_to_accept_any_new_request: 10
    max_clients_to_accept_short_new_request: 100
    direct_distance_to_consider_short_request: 100
    short_request_max_steps: 1000
    short_request_ratio: 0.5
    min_steps_to_check_path_find_termination: 2000
    start_to_goal_cost_multiplier_to_terminate_path_find: 2000.0
    overload_levels:
    - 0
    - 100
    - 500
    overload_multipliers:
    - 2
    - 3
    - 4
    negative_path_cache_delay_interval: 20
  max_failed_behavior_count: 3

